# ======================================================
#  모찌랩 웹사이트 - Cloudflare Workers 배포 설정
#  (GitHub 에 올리면 Cloudflare 가 이 파일을 읽어 자동 배포합니다)
#  저장소 맨 위에 두어서, Cloudflare 의 '루트 디렉터리' 설정 없이도 배포됩니다.
#  사이트 프로그램은 web 폴더에 있습니다.
# ======================================================
name = "mozzilab"
main = "web/src/index.tsx"
compatibility_date = "2024-12-18"

# 대시보드에서 넣은 변수를 배포할 때 지우지 않음
keep_vars = true

# 도메인 연결 전에도 접속할 수 있는 예비 주소 (https://mozzilab.<계정이름>.workers.dev)
workers_dev = true

# 배포 직전: 모찌한글 웹 버전(핸드폰 · 브라우저용)을 다운로드 페이지에서 받아 web/public/hwp 에 둔다
# (받을 버전은 web/hwp-version.txt — 설치파일 배포가 끝나면 자동으로 바뀌고, 그 변경으로 홈페이지가 다시 배포됨)
[build]
# (저장소 맨 위에서 배포하든 web 폴더에서 배포하든 같은 스크립트를 찾게)
command = "test -f web/scripts/fetch-hwp-web.mjs && node web/scripts/fetch-hwp-web.mjs || node scripts/fetch-hwp-web.mjs"

# 그림·CSS 같은 고정 파일
[assets]
directory = "./web/public"

# 2차 도메인 연결 (labelpos.com 이 Cloudflare 에 등록되어 있어야 함)
[[routes]]
pattern = "mozzilab.labelpos.com"
custom_domain = true

# 데이터베이스 (Cloudflare D1)
# (Cloudflare 계정에 이미 만들어 둔 mozzilab-db)
[[d1_databases]]
binding = "DB"
database_name = "mozzilab-db"
database_id = "de5a754b-03d1-4a1d-b560-8b953910d979"

# PC 프로그램 실시간 알림 통로 (유료 전환 · 기기 해제가 켜져 있는 프로그램에 바로 반영되게)
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveHub"

[[migrations]]
tag = "v1-live"
new_sqlite_classes = ["LiveHub"]

# 매일 00:00 UTC = 한국 시간 오전 9시 정기결제 실행
[triggers]
crons = ["0 0 * * *"]

# 공개해도 되는 설정 (비밀번호·결제 키는 여기 넣지 말고 대시보드의 Secret 으로!)
[vars]
SITE_URL = "https://mozzilab.labelpos.com"
COMPANY_NAME = "모찌랩"
SUPPORT_EMAIL = "help@labelpos.com"
CAPTURE_DOWNLOAD_URL = "https://github.com/kiha797/mozzilab/releases/latest/download/MochiCapture_Setup.exe"
