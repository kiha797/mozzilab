# 모찌LAB. 설치파일 자동 만들기 + 자동 업데이트 배포
# GitHub 의 Windows 컴퓨터에서 모찌캡처 · 모찌PDF · 모찌압축 · 모찌포토 · 모찌벡터 · 모찌한글 설치파일(Setup.exe)을 만들고
# 저장소의 [Releases] (다운로드 페이지)에 올립니다. 설치된 프로그램은 이것을 보고 스스로 업데이트합니다.
#
# 언제 실행되나요?
#  - main 브랜치에 프로그램 코드(mochi_* · shared · artcraft_kit)가 바뀌어 올라오면 자동으로 (버전은 끝자리 +1)
#  - 저장소 > Actions > "설치파일 만들기" > Run workflow (버전을 비워 두면 자동, 직접 적어도 됨)
name: 설치파일 만들기

on:
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (비워 두면 지금 버전의 끝자리 +1, 예: 1.3.0 → 1.3.1)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "mochi_*/**"
      - "shared/**"
      - "artcraft_kit/**"
      - ".github/workflows/release.yml"
    tags: ["v*"]

permissions:
  contents: write

# 배포는 한 번에 하나씩 (먼저 시작한 것이 끝난 뒤 다음 것)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: 버전 정하기
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$v" ]; then
            last=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo v1.0.0)
            last="${last#v}"
            IFS=. read -r a b c <<< "$last"
            v="$a.$b.$((c + 1))"
          fi
          echo "새 버전: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: mochi_capture, exe: MochiCapture, name: 모찌캡처, extra: "" }
          - { dir: mochi_pdf, exe: MochiPDF, name: 모찌PDF, extra: "--collect-all pypdfium2 --collect-all pypdfium2_raw" }
          - { dir: mochi_zip, exe: MochiZip, name: 모찌압축, extra: "--collect-submodules py7zr" }
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        id: ver
        run: |
          "version=${{ needs.version.outputs.version }}" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 버전 번호 넣기
        run: |
          (Get-Content brand.py -Encoding utf8) -replace 'APP_VERSION = ".*"', 'APP_VERSION = "${{ steps.ver.outputs.version }}"' | Set-Content brand.py -Encoding utf8

      - name: 실행파일(exe) 만들기
        run: |
          pyinstaller --noconfirm --clean --windowed --name ${{ matrix.exe }} --icon assets\app.ico --paths ..\shared --add-data "assets;assets" ${{ matrix.extra }} main.py

      - name: 실행 점검 (selftest)
        run: |
          $p = Start-Process -FilePath "dist\${{ matrix.exe }}\${{ matrix.exe }}.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "${{ matrix.name }} 실행 점검 실패 (종료 코드 $($p.ExitCode))" }
          Write-Host "${{ matrix.name }} 실행 점검 통과"

      - name: Inno Setup 준비
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: 설치파일(Setup.exe) 만들기
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          Get-ChildItem installer_output

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe }}
          path: ${{ matrix.dir }}/installer_output/${{ matrix.exe }}_Setup.exe
          if-no-files-found: error

  # 모찌포토 · 모찌벡터: 아트크래프트(PhotoCraft · VectorCraft) 오픈소스를 받아서
  # artcraft_kit/apply.py 로 모찌 버전으로 바꾼 뒤 Rust 로 빌드한다
  craft:
    name: ${{ matrix.name }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: photo, dir: mochi_photo, exe: MochiPhoto, name: 모찌포토, pkg: photocraft }
          - { app: vector, dir: mochi_vector, exe: MochiVector, name: 모찌벡터, pkg: vectorcraft }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        id: ver
        run: |
          "version=${{ needs.version.outputs.version }}" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 원본 소스 받기 (고정된 커밋)
        run: |
          $u = (Get-Content artcraft_kit/upstream.json -Raw | ConvertFrom-Json).${{ matrix.app }}
          git init -q src
          # 윈도우 줄바꿈(CRLF)으로 바뀌면 apply.py 가 고칠 곳을 못 찾으니 원본 그대로 받는다
          git -C src config core.autocrlf false
          git -C src remote add origin $u.repo
          git -C src fetch -q --depth 1 origin $u.rev
          git -C src checkout -q FETCH_HEAD

      - name: 모찌 버전으로 바꾸기 (이름 · 아이콘 · 로그인 · 광고 · 업데이트)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install -q Pillow
          python artcraft_kit/apply.py ${{ matrix.app }} src ${{ steps.ver.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target
          key: ${{ matrix.app }}

      - name: 실행파일(exe) 만들기
        working-directory: src
        env:
          # Visual C++ 런타임이 없는 PC 에서도 바로 실행되게 런타임을 exe 안에 넣는다
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release -p ${{ matrix.pkg }}

      - name: 설치할 파일 모으기
        run: |
          $dist = "${{ matrix.dir }}/dist"
          New-Item -ItemType Directory -Force "$dist/licenses" | Out-Null
          Copy-Item "src/target/release/${{ matrix.pkg }}.exe" "$dist/${{ matrix.exe }}.exe"
          foreach ($f in @("LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "ATTRIBUTION.md")) {
            if (Test-Path "src/$f") { Copy-Item "src/$f" "$dist/licenses/$f" }
          }
          Get-ChildItem $dist -Recurse | Select-Object FullName, Length

      - name: 실행 점검 (--version)
        run: |
          $p = Start-Process -FilePath "${{ matrix.dir }}/dist/${{ matrix.exe }}.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "${{ matrix.name }} 실행 점검 실패 (종료 코드 $($p.ExitCode))" }
          Write-Host "${{ matrix.name }} 실행 점검 통과"

      - name: Inno Setup 준비
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: 설치파일(Setup.exe) 만들기
        working-directory: ${{ matrix.dir }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          Get-ChildItem installer_output

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe }}
          path: ${{ matrix.dir }}/installer_output/${{ matrix.exe }}_Setup.exe
          if-no-files-found: error

  # 모찌한글: 오픈소스 HWP 편집기(rhwp)의 편집 화면을 모찌한글로 바꾸고 데스크톱 앱(Tauri)으로 묶는다
  hwp:
    name: 모찌한글
    needs: version
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        id: ver
        run: |
          "version=${{ needs.version.outputs.version }}" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 원본 소스 받기 (필요한 폴더만, 고정된 커밋)
        run: |
          $u = (Get-Content artcraft_kit/upstream.json -Raw | ConvertFrom-Json).hwp
          git init -q src
          git -C src config core.autocrlf false
          git -C src config core.symlinks true
          git -C src remote add origin $u.repo
          git -C src sparse-checkout set --no-cone @($u.paths)
          git -C src fetch -q --depth 1 --filter=blob:none origin $u.rev
          git -C src checkout -q FETCH_HEAD
          Get-ChildItem src | Select-Object Name

      - name: 모찌한글로 바꾸기 (이름 · 아이콘 · 로그인 · 광고 · 업데이트)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install -q Pillow
          python artcraft_kit/apply.py hwp src ${{ steps.ver.outputs.version }}

      - name: 편집 엔진(WebAssembly) 만들기
        working-directory: src
        run: |
          $wp = "https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-pc-windows-msvc.tar.gz"
          Invoke-WebRequest $wp -OutFile wp.tgz
          tar -xzf wp.tgz
          $env:PATH = "$PWD\wasm-pack-v0.15.0-x86_64-pc-windows-msvc;$env:PATH"
          rustup show
          wasm-pack build --target web --release

      - name: 편집 화면 만들기
        working-directory: src/rhwp-studio
        env:
          RHWP_WITHOUT_HWPCTRL: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 데스크톱 앱(exe) 만들기
        working-directory: src/mochi-desk
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release

      - name: 설치할 파일 모으기
        run: |
          $dist = "mochi_hwp/dist"
          New-Item -ItemType Directory -Force "$dist/licenses" | Out-Null
          Copy-Item "src/mochi-desk/target/release/MochiHwp.exe" "$dist/MochiHwp.exe"
          foreach ($f in @("LICENSE", "THIRD_PARTY_LICENSES.md")) { if (Test-Path "src/$f") { Copy-Item "src/$f" "$dist/licenses/$f" } }
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$dist/MicrosoftEdgeWebview2Setup.exe"
          Get-ChildItem $dist -Recurse | Select-Object FullName, Length

      - name: 실행 점검 (--version)
        run: |
          $p = Start-Process -FilePath "mochi_hwp/dist/MochiHwp.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "모찌한글 실행 점검 실패 (종료 코드 $($p.ExitCode))" }
          Write-Host "모찌한글 실행 점검 통과"

      - name: Inno Setup 준비
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: 설치파일(Setup.exe) 만들기
        working-directory: mochi_hwp
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          Get-ChildItem installer_output

      - uses: actions/upload-artifact@v4
        with:
          name: MochiHwp
          path: mochi_hwp/installer_output/MochiHwp_Setup.exe
          if-no-files-found: error

  release:
    name: 다운로드 페이지에 올리기
    needs: [version, build, craft, hwp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 버전 정하기
        id: ver
        run: echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 모찌LAB. v${{ steps.ver.outputs.version }}
          make_latest: "true"
          body: |
            ## 🍡 모찌LAB. 프로그램 v${{ steps.ver.outputs.version }}
            | 프로그램 | 설치파일 |
            |---|---|
            | 📸 모찌캡처 | `MochiCapture_Setup.exe` |
            | 📄 모찌PDF | `MochiPDF_Setup.exe` |
            | 🗜️ 모찌압축 | `MochiZip_Setup.exe` |
            | 🎨 모찌포토 (포토샵 대체) | `MochiPhoto_Setup.exe` |
            | ✒️ 모찌벡터 (일러스트 대체) | `MochiVector_Setup.exe` |
            | 📝 모찌한글 (한글 HWP · HWPX 편집) | `MochiHwp_Setup.exe` |

            [필수] 설치된 프로그램은 자동으로 이 버전으로 업데이트됩니다.

            Windows 10 / 11 · 무료 버전은 광고가 표시됩니다 · 광고 없이 쓰기: https://mozzilab.labelpos.com/pricing
          files: out/*.exe
